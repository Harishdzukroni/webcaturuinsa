<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Pemain</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .rating-badge { background: #2c3e50; color: white; padding: 5px 10px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; }
        .top-player { background-color: #fff9c4 !important; border-left: 5px solid #f1c40f; }
        .form-box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; gap: 10px; align-items: end; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--primary-color); }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-sm-delete { background: #ff7675; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-sm-delete:hover { background: #d63031; }
    </style>
</head>
<body>
    <nav class="navbar">
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo-img"> 
        <span class="logo-text">UINSA Chess Club</span>
    </div>

    <ul class="menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="rating.html">Top Rating</a></li>
        <li><a href="turnamen.html">Turnamen</a></li>
        <li><a href="pemain.html">Data Pemain</a></li>
        <li><a href="arsip.html">Arsip</a></li>
    </ul>
</nav>

    <div class="container">
        <h1>👥 Database Anggota</h1>
        <p style="text-align:center; color:#666;">Data atlet dan rating resmi (Sinkronisasi Cloud).</p>

        <div id="adminPanel" class="form-box" style="display: none;">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="inputNama" placeholder="Nama baru...">
            </div>
            <div class="form-group" style="max-width: 150px;">
                <label>Rating Awal</label>
                <input type="number" id="inputRating" value="1000">
            </div>
            <button class="btn-add" onclick="tambahPemainBaru()" style="height: 46px;">+ Simpan</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th style="text-align:left; padding-left:20px;">Nama Pemain</th>
                    <th>Elo Rating</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelPemain">
                <tr><td colspan="4" style="padding:20px; text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- 1. Konfigurasi & Cek Akses ---
        const ROLE = localStorage.getItem('ukm_role');
        
        // Proteksi Halaman (Opsional, redirect jika tidak ada akses sama sekali)
        if (!ROLE) window.location.href = 'login.html';

        // Tampilkan panel admin hanya jika role = admin
        if (ROLE === 'admin') {
            document.getElementById('adminPanel').style.display = 'flex';
        }

        // Inisialisasi Firestore
        const db = firebase.firestore();
        const playersRef = db.collection('pemain');

        // --- 2. Real-time Listener (READ) ---
        // Kode ini akan berjalan otomatis setiap ada perubahan data di server
        playersRef.orderBy('rating', 'desc').onSnapshot((snapshot) => {
            let dataPemain = [];
            snapshot.forEach((doc) => {
                // Kita gabungkan data dengan ID dokumen agar bisa dihapus nanti
                dataPemain.push({ id: doc.id, ...doc.data() });
            });
            renderTabel(dataPemain);
        }, (error) => {
            console.error("Error mengambil data:", error);
            document.getElementById("tabelPemain").innerHTML = `<tr><td colspan='4'>Gagal memuat data. Periksa koneksi internet.</td></tr>`;
        });

        // --- 3. Fungsi Tambah Pemain (CREATE) ---
        async function tambahPemainBaru() {
            let namaInput = document.getElementById("inputNama").value.trim();
            // Format Title Case
            let namaBersih = namaInput.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
            let rating = parseInt(document.getElementById("inputRating").value);

            if (namaBersih === "" || isNaN(rating)) return alert("Data tidak lengkap!");

            try {
                // Cek Duplikat di Firestore
                const cekDuplikat = await playersRef.where('nama', '==', namaBersih).get();
                
                if (!cekDuplikat.empty) {
                    alert("Nama pemain sudah ada di database!");
                    return;
                }

                // Simpan ke Firestore
                await playersRef.add({
                    nama: namaBersih,
                    rating: rating
                });

                // Reset Form
                document.getElementById("inputNama").value = "";
                alert("Berhasil menambahkan " + namaBersih);

            } catch (error) {
                console.error("Error menambah:", error);
                alert("Gagal menyimpan data.");
            }
        }

        // --- 4. Fungsi Hapus Pemain (DELETE) ---
        function hapusPemain(docId, namaPemain) {
            if (ROLE !== 'admin') return alert("Akses ditolak!");
            
            if(confirm(`Yakin ingin menghapus data atlet "${namaPemain}"? Data tidak bisa dikembalikan.`)) {
                playersRef.doc(docId).delete().then(() => {
                    console.log("Data terhapus");
                    // Tidak perlu panggil renderTabel, karena onSnapshot akan otomatis mendeteksi
                }).catch((error) => {
                    alert("Gagal menghapus: " + error.message);
                });
            }
        }

        // --- 5. Render Tabel ---
        function renderTabel(listPemain) {
            let tbody = document.getElementById("tabelPemain");
            tbody.innerHTML = "";

            if (listPemain.length === 0) { 
                tbody.innerHTML = "<tr><td colspan='4' style='padding:20px; color:#999;'>Belum ada data pemain di database.</td></tr>"; 
                return; 
            }

            listPemain.forEach((pemain, index) => {
                let medali = ""; 
                let kelas = "";
                
                // Logika Peringkat
                if(index === 0) { medali = "🥇"; kelas="top-player"; }
                else if(index === 1) medali = "🥈";
                else if(index === 2) medali = "🥉";

                // Tombol Hapus (Hanya admin)
                // Kita kirim ID Dokumen ke fungsi hapus
                let tombolHapus = (ROLE === 'admin') 
                    ? `<button class="btn-sm-delete" onclick="hapusPemain('${pemain.id}', '${pemain.nama}')">Hapus</button>` 
                    : `<span style="color:#ccc; font-size:0.8rem;">-</span>`;

                tbody.innerHTML += `
                <tr class="${kelas}">
                    <td>${index + 1} ${medali}</td>
                    <td style="text-align:left; padding-left:20px; font-weight:600;">${pemain.nama}</td>
                    <td><span class="rating-badge">${pemain.rating}</span></td>
                    <td>${tombolHapus}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
