<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Turnamen - UKM Catur</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* CSS Match Card (Sama seperti sebelumnya) */
        .match-card {
            display: grid;
            grid-template-columns: 1fr 140px 1fr; 
            gap: 15px;
            align-items: center;
            padding: 15px 20px;
            background: white;
            border-radius: 8px;
            border-left: 5px solid #bdc3c7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            transition: border-left-color 0.3s ease;
        }

        .player-side {
            font-weight: 700;
            font-size: 1.05rem;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden; 
            white-space: nowrap;
        }

        .side-left { justify-content: flex-end; text-align: right; }
        .side-right { justify-content: flex-start; text-align: left; }
        .p-name { overflow: hidden; text-overflow: ellipsis; }
        .dot-piece { font-size: 1rem; opacity: 0.9; }

        .match-center { display: flex; justify-content: center; align-items: center; }

        .hasil-match {
            width: 100%;
            padding: 8px 5px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #dfe6e9;
            border-radius: 6px;
            background-color: #f8f9fa;
            color: #333;
            cursor: pointer;
            font-size: 1rem;
            appearance: none; 
            -webkit-appearance: none; 
            transition: 0.2s;
        }

        .hasil-match:hover { border-color: #f1c40f; }
        .hasil-match:focus { outline: none; border-color: #27ae60; background: #fff; }
        
        /* Style Status Aktif */
        .match-done { border-left-color: #27ae60 !important; }
        .select-done { background-color: #27ae60 !important; color: white !important; border-color: #27ae60 !important; }

        .ronde-header {
            background:#34495e; 
            color:white; 
            padding:8px 15px; 
            margin-top:25px; 
            margin-bottom: 10px;
            font-weight:bold; 
            border-radius:6px; 
            font-size:0.9rem; 
            text-transform:uppercase; 
            letter-spacing:1px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .match-card { grid-template-columns: 1fr; text-align: center; gap: 8px; padding: 15px; }
            .side-left { justify-content: center; text-align: center; flex-direction: column-reverse; gap: 2px;}
            .side-right { justify-content: center; text-align: center; flex-direction: column; gap: 2px; }
            .match-center { width: 100%; margin: 5px 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img"> 
            <span class="logo-text">UINSA Chess Club</span>
        </div>
        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="rating.html">Top Rating</a></li>
            <li><a href="turnamen.html">Turnamen</a></li>
            <li><a href="pemain.html">Data Pemain</a></li>
            <li><a href="arsip.html">Arsip</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Manajer Turnamen (Cloud)</h1>
        
        <div id="setupPanel" style="display:none;">
            <div id="adminControls">
                <div class="input-group">
                    <input type="text" id="namaPemain" list="saranNama" placeholder="Ketik nama peserta..." autocomplete="off">
                    <datalist id="saranNama"></datalist>
                    <button class="btn-add" onclick="tambahPemainKeList()">+ Tambah</button>
                </div>
                
                <h3>Daftar Peserta (<span id="jumlahPeserta">0</span>)</h3>
                <ul id="listPemain"></ul>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

                <div style="margin-bottom: 10px;">
                    <label style="font-weight:bold; color:var(--primary-color);">Nama Turnamen:</label>
                    <input type="text" id="judulTurnamen" placeholder="Contoh: Piala Rektor 2026" style="width:100%; margin-top:5px;">
                </div>

                <button class="btn-generate" onclick="mulaiTurnamen()">⚡ BUAT JADWAL & MULAI</button>
            </div>
            
            <div id="waitingMessage" style="display:none; text-align:center; padding:30px; background:#eee; border-radius:10px;">
                <h3>Belum ada turnamen aktif.</h3>
                <p>Tunggu admin memulai turnamen.</p>
            </div>
        </div>

        <div id="areaTurnamen" style="display:none;">
            <h2 style="text-align:center; color:var(--accent-color); text-transform:uppercase;" id="displayJudul"></h2>
            
            <div id="wadahJadwal"></div>

            <h2 style="margin-top:40px;">📊 Klasemen Sementara</h2>
            <table id="tabelKlasemen">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama Pemain</th>
                        <th>Poin</th>
                    </tr>
                </thead>
                <tbody id="isiKlasemen"></tbody>
            </table>

            <hr style="margin-top: 40px;">

            <div id="adminActions" style="display:none;">
                <a href="live.html" target="_blank" style="display:block; text-align:center; background:#8e44ad; color:white; padding:15px; border-radius:8px; text-decoration:none; font-weight:bold; margin-bottom:20px;">
                    📢 Buka Layar Proyektor
                </a>

                <div style="display: flex; gap: 10px;">
                    <button class="btn-add" style="flex: 2; background: var(--primary-color);" onclick="selesaikanTurnamen()">
                        💾 Selesai, Hitung Rating & Arsip
                    </button>
                    <button class="btn-danger" style="flex: 1; margin: 0;" onclick="resetTurnamen()">
                        🗑️ Batal
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. KONFIGURASI FIREBASE & AUTH ---
        const ROLE = localStorage.getItem('ukm_role');
        if (!ROLE) window.location.href = 'login.html';

        const db = firebase.firestore();
        const liveRef = db.collection('pengaturan').doc('live');
        const playersRef = db.collection('pemain');

        // Variabel Lokal untuk Setup Awal
        let draftPeserta = []; 
        let globalMatches = []; // Menyimpan state match saat ini
        let mapPemainId = {}; // Menyimpan { "Nama Pemain": "ID_Firestore" } untuk update rating

        // --- 2. INISIALISASI HALAMAN ---
        window.addEventListener('DOMContentLoaded', async () => {
            // Load Data Pemain untuk Autocomplete
            const snapshot = await playersRef.get();
            const datalist = document.getElementById("saranNama");
            datalist.innerHTML = "";
            
            snapshot.forEach(doc => {
                const data = doc.data();
                // Simpan mapping ID untuk keperluan arsip nanti
                mapPemainId[data.nama] = doc.id;
                
                let option = document.createElement("option");
                option.value = data.nama; 
                option.label = `Rating: ${data.rating}`; 
                datalist.appendChild(option);
            });

            // Mulai mendengarkan status Turnamen
            listenToTournament();
        });

        // --- 3. LOGIKA REAL-TIME (LISTENER) ---
        function listenToTournament() {
            liveRef.onSnapshot((doc) => {
                const data = doc.data();
                const setupPanel = document.getElementById('setupPanel');
                const areaTurnamen = document.getElementById('areaTurnamen');
                const adminControls = document.getElementById('adminControls');
                const waitingMsg = document.getElementById('waitingMessage');
                const adminActions = document.getElementById('adminActions');

                if (doc.exists && data.aktif === true) {
                    // MODE: TURNAMEN AKTIF
                    setupPanel.style.display = 'none';
                    areaTurnamen.style.display = 'block';
                    
                    if (ROLE === 'admin') adminActions.style.display = 'block';

                    document.getElementById('displayJudul').innerText = data.nama_turnamen;
                    globalMatches = data.matches || [];
                    
                    renderJadwal(globalMatches);
                    hitungKlasemen(globalMatches, data.peserta);

                } else {
                    // MODE: SETUP / MENUNGGU
                    areaTurnamen.style.display = 'none';
                    setupPanel.style.display = 'block';

                    if (ROLE === 'admin') {
                        adminControls.style.display = 'block';
                        waitingMsg.style.display = 'none';
                    } else {
                        adminControls.style.display = 'none';
                        waitingMsg.style.display = 'block';
                    }
                }
            });
        }

        // --- 4. FUNGSI SETUP (ADMIN) ---
        function tambahPemainKeList() {
            let input = document.getElementById("namaPemain");
            let nama = input.value.trim().replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());

            if (nama === "") return;
            if (draftPeserta.includes(nama)) { alert("Pemain sudah masuk list!"); return; }

            draftPeserta.push(nama);
            renderDraftList();
            input.value = ""; 
        }

        function renderDraftList() {
            let list = document.getElementById("listPemain");
            list.innerHTML = "";
            draftPeserta.forEach((p, i) => {
                list.innerHTML += `<li>${p} <span style='color:red; cursor:pointer; margin-left:10px;' onclick='draftPeserta.splice(${i},1); renderDraftList()'>✕</span></li>`;
            });
            document.getElementById("jumlahPeserta").innerText = draftPeserta.length;
        }

        function mulaiTurnamen() {
            if (draftPeserta.length < 3) return alert("Minimal 3 pemain!");
            let judul = document.getElementById("judulTurnamen").value.trim();
            if (!judul) return alert("Isi nama turnamen!");

            // GENERATE JADWAL ROUND ROBIN (JSON)
            let matches = [];
            let tempPeserta = [...draftPeserta];
            if (tempPeserta.length % 2 !== 0) tempPeserta.push("BYE"); // Dummy untuk ganjil

            let totalRonde = tempPeserta.length - 1;
            let setengah = tempPeserta.length / 2;

            for (let r = 1; r <= totalRonde; r++) {
                for (let i = 0; i < setengah; i++) {
                    let p1 = tempPeserta[i];
                    let p2 = tempPeserta[tempPeserta.length - 1 - i];
                    
                    if (p1 !== "BYE" && p2 !== "BYE") {
                        matches.push({
                            ronde: r,
                            putih: p1,
                            hitam: p2,
                            skor: "belum", // Nilai awal
                            selesai: false
                        });
                    }
                }
                // Rotasi Array
                tempPeserta.splice(1, 0, tempPeserta.pop()); 
            }

            // SIMPAN KE FIRESTORE (Ini akan memicu listener di semua klien)
            liveRef.set({
                aktif: true,
                nama_turnamen: judul,
                peserta: draftPeserta,
                matches: matches,
                tgl_mulai: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                console.log("Turnamen dimulai!");
            }).catch(err => alert("Gagal memulai: " + err.message));
        }

        // --- 5. RENDER JADWAL & UPDATE SKOR ---
        function renderJadwal(matches) {
            const container = document.getElementById("wadahJadwal");
            container.innerHTML = "";
            
            // Kelompokkan match berdasarkan ronde
            // Gunakan Set untuk mengetahui total ronde unik
            let maxRonde = 0;
            matches.forEach(m => { if(m.ronde > maxRonde) maxRonde = m.ronde });

            for (let r = 1; r <= maxRonde; r++) {
                let html = `<div class="ronde-header">Babak ${r}</div>`;
                
                // Filter match di ronde ini
                matches.forEach((match, index) => {
                    if (match.ronde === r) {
                        let cardClass = match.selesai ? "match-card match-done" : "match-card";
                        let selectClass = match.selesai ? "hasil-match select-done" : "hasil-match";
                        
                        // Disable input jika bukan admin
                        let disabled = (ROLE !== 'admin') ? "disabled" : "";
                        let displayValue = (match.skor === "belum") ? "vs" : match.skor;

                        html += `
                        <div class="${cardClass}">
                            <div class="player-side side-left">
                                <span class="p-name">${match.putih}</span> <span class="dot-piece">⚪</span>
                            </div>
                            <div class="match-center">
                                <select class="${selectClass}" onchange="updateSkor(${index}, this.value)" ${disabled}>
                                    <option value="belum" ${match.skor === 'belum' ? 'selected' : ''}>VS</option>
                                    <option value="1-0" ${match.skor === '1-0' ? 'selected' : ''}>1 - 0</option>
                                    <option value="0-1" ${match.skor === '0-1' ? 'selected' : ''}>0 - 1</option>
                                    <option value="0.5-0.5" ${match.skor === '0.5-0.5' ? 'selected' : ''}>½ - ½</option>
                                </select>
                            </div>
                            <div class="player-side side-right">
                                <span class="dot-piece">⚫</span> <span class="p-name">${match.hitam}</span>
                            </div>
                        </div>`;
                    }
                });
                container.innerHTML += html;
            }
        }

        // FUNGSI UPDATE SKOR (REALTIME)
        function updateSkor(index, nilaiBaru) {
            if (ROLE !== 'admin') return;

            // Update array lokal
            globalMatches[index].skor = nilaiBaru;
            globalMatches[index].selesai = (nilaiBaru !== 'belum');

            // Kirim update ke Firestore (Hanya update field matches)
            liveRef.update({
                matches: globalMatches
            }).catch(err => alert("Gagal update skor: " + err.message));
        }

        // --- 6. KLASEMEN ---
        function hitungKlasemen(matches, listPeserta) {
            let skor = {};
            if(!listPeserta) return;
            listPeserta.forEach(p => skor[p] = 0);

            matches.forEach(m => {
                if (m.selesai) {
                    if (m.skor === "1-0") skor[m.putih] += 1;
                    else if (m.skor === "0-1") skor[m.hitam] += 1;
                    else if (m.skor === "0.5-0.5") { skor[m.putih] += 0.5; skor[m.hitam] += 0.5; }
                }
            });

            let urutan = Object.keys(skor).map(key => ({ nama: key, poin: skor[key] }));
            urutan.sort((a, b) => b.poin - a.poin);

            let tbody = document.getElementById("isiKlasemen");
            tbody.innerHTML = "";
            urutan.forEach((d, i) => {
                let medali = (i===0 && d.poin > 0) ? "👑" : "";
                tbody.innerHTML += `<tr><td>${i+1} ${medali}</td><td>${d.nama}</td><td>${d.poin}</td></tr>`;
            });

            return urutan; // Return data untuk arsip
        }

        // --- 7. ARSIP & SELESAI (DATABASE TRANSACTION) ---
        async function selesaikanTurnamen() {
            if (!confirm("Selesaikan turnamen? Rating akan dihitung permanen.")) return;

            try {
                // Ambil data terbaru dulu untuk memastikan rating akurat
                const liveDoc = await liveRef.get();
                const liveData = liveDoc.data();
                const playersSnapshot = await playersRef.get();
                
                // Siapkan data pemain lokal untuk hitung ELO
                let dbPemain = [];
                playersSnapshot.forEach(doc => {
                    dbPemain.push({ id: doc.id, ...doc.data() });
                });

                // Batch Writer (Agar semua tersimpan atau gagal sama sekali)
                const batch = db.batch();

                // 1. Hitung Rating ELO
                let ratingChanges = {}; // Log perubahan
                
                liveData.matches.forEach(match => {
                    if (!match.selesai) return;

                    let p1 = dbPemain.find(p => p.nama === match.putih);
                    let p2 = dbPemain.find(p => p.nama === match.hitam);

                    if (p1 && p2) {
                        let score1 = (match.skor === "1-0") ? 1 : (match.skor === "0.5-0.5" ? 0.5 : 0);
                        let k = 32; 
                        
                        let expected1 = 1 / (1 + Math.pow(10, (p2.rating - p1.rating) / 400));
                        let change1 = Math.round(k * (score1 - expected1));
                        
                        // Terapkan perubahan ke objek lokal (untuk perhitungan match selanjutnya jika ada, tapi round robin rating dihitung di akhir biasanya aman)
                        // Namun ELO standar dihitung per game. Kita update objek lokal.
                        p1.rating += change1;
                        p2.rating += (change1 * -1); // Zero sum game approximation for simple Elo
                        
                        // Catat untuk Batch Update
                        // Note: Ini simplifikasi. Jika 1 pemain main berkali-kali, kita harus akumulasi delta-nya dulu.
                        if(!ratingChanges[p1.id]) ratingChanges[p1.id] = 0;
                        if(!ratingChanges[p2.id]) ratingChanges[p2.id] = 0;
                        
                        ratingChanges[p1.id] += change1;
                        ratingChanges[p2.id] -= change1;
                    }
                });

                // 2. Masukkan Update Pemain ke Batch
                for (let [playerId, change] of Object.entries(ratingChanges)) {
                    if (change !== 0) {
                        let ref = playersRef.doc(playerId);
                        batch.update(ref, { rating: firebase.firestore.FieldValue.increment(change) });
                    }
                }

                // 3. Simpan ke Arsip
                let klasemenAkhir = hitungKlasemen(liveData.matches, liveData.peserta);
                let arsipRef = db.collection('riwayat_turnamen').doc();
                batch.set(arsipRef, {
                    nama_turnamen: liveData.nama_turnamen,
                    tanggal: firebase.firestore.Timestamp.now(),
                    jumlah_peserta: liveData.peserta.length,
                    detail_klasemen: klasemenAkhir,
                    matches: liveData.matches
                });

                // 4. Reset Turnamen Aktif
                batch.update(liveRef, { aktif: false, matches: [], peserta: [] });

                // JALANKAN BATCH
                await batch.commit();

                alert("Turnamen Berhasil Diarsipkan!");
                window.location.href = "arsip.html";

            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan: " + error.message);
            }
        }

        function resetTurnamen() {
            if (confirm("Yakin batalkan turnamen? Semua data skor akan hilang.")) {
                liveRef.update({ aktif: false, matches: [], peserta: [] });
            }
        }
    </script>
</body>
</html>
