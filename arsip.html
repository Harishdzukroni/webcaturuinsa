<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Turnamen - UKM Catur</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .grid-arsip { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-history { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 5px solid var(--primary-color); transition: transform 0.2s; position: relative; }
        .card-history:hover { transform: translateY(-5px); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .card-header h3 { margin: 0; color: var(--primary-color); font-size: 1.2rem; text-transform: capitalize; max-width: 85%; }
        .btn-trash-icon { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #e74c3c; opacity: 0.3; transition: all 0.2s; padding: 0; }
        .btn-trash-icon:hover { opacity: 1; transform: scale(1.2); }
        .tanggal-arsip { color: #95a5a6; font-size: 0.85rem; margin-bottom: 15px; display: block; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .btn-detail { display: block; width: 100%; padding: 10px; margin-top: 15px; background: var(--accent-color); color: white; text-align: center; border-radius: 6px; border: none; cursor: pointer; }
        
        /* MODAL STYLE */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 30px; border-radius: 10px; width: 95%; max-width: 700px; max-height: 80vh; overflow-y: auto; position: relative; animation: muncul 0.3s ease-out; }
        @keyframes muncul { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: red; }

        /* Badge Rating */
        .badge-naik { color: #27ae60; font-weight: bold; background: #e8f8f5; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .badge-turun { color: #c0392b; font-weight: bold; background: #fdedec; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .badge-tetap { color: #7f8c8d; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img"> 
            <span class="logo-text">UINSA Chess CLub</span>
        </div>
        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="rating.html">Top Rating</a></li>
            <li><a href="turnamen.html">Turnamen</a></li>
            <li><a href="pemain.html">Data Pemain</a></li>
            <li><a href="arsip.html">Arsip</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>📚 Perpustakaan Turnamen</h1>
        <p style="text-align: center; color: #666;">Riwayat pertandingan (Disimpan di Cloud).</p>

        <div id="wadahArsip" class="grid-arsip">
            <p style="text-align:center; width:100%;">Memuat data dari server...</p>
        </div>
        
        <hr style="margin-top: 50px; border: 0; border-top: 1px solid #ddd;">
        
        <div id="dangerZone" style="display:none; text-align:center;">
            <p style="font-size:0.8rem; color:red;">*Area Admin</p>
        </div>
    </div>

    <div id="modalDetail" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupModal()">&times;</span>
            <h2 id="judulModal" style="color:var(--primary-color); margin-bottom:5px;"></h2>
            <p id="infoModal" style="color:#777; margin-bottom:20px;"></p>
            
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama Pemain</th>
                        <th>Total Poin</th>
                        </tr>
                </thead>
                <tbody id="tabelDetail"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & AUTH ---
        const ROLE = localStorage.getItem('ukm_role');
        if (!ROLE) window.location.href = 'login.html';

        if(ROLE === 'admin') {
            document.getElementById('dangerZone').style.display = 'block';
        }

        const db = firebase.firestore();
        const arsipRef = db.collection('riwayat_turnamen');
        
        // Simpan data di variabel global agar bisa diakses Modal
        let globalArsipData = [];

        // --- 2. LOAD DATA (READ) ---
        window.addEventListener('DOMContentLoaded', () => {
            loadArsip();
        });

        function loadArsip() {
            // Urutkan berdasarkan tanggal terbaru
            arsipRef.orderBy('tanggal', 'desc').get().then((querySnapshot) => {
                const container = document.getElementById("wadahArsip");
                container.innerHTML = "";
                globalArsipData = []; // Reset

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; width:100%; color:#aaa;'>Belum ada turnamen yang diarsipkan.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Simpan ID dokumen untuk keperluan hapus
                    const arsipItem = { id: doc.id, ...data };
                    globalArsipData.push(arsipItem);
                    
                    // Format Tanggal dari Timestamp Firestore
                    let tanggalStr = "-";
                    let jamStr = "-";
                    
                    if (data.tanggal && data.tanggal.toDate) {
                        const dateObj = data.tanggal.toDate();
                        tanggalStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                        jamStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    }

                    // Ambil Juara 1
                    let juara1 = (data.detail_klasemen && data.detail_klasemen.length > 0) 
                        ? data.detail_klasemen[0].nama 
                        : "Tidak ada";

                    // Tombol Hapus (Hanya Admin)
                    let btnHapus = (ROLE === 'admin') 
                        ? `<button class="btn-trash-icon" onclick="hapusSatuArsip('${doc.id}')" title="Hapus Turnamen Ini">🗑️</button>` 
                        : '';

                    // Render Card
                    container.innerHTML += `
                    <div class="card-history">
                        <div class="card-header">
                            <h3>🏆 ${data.nama_turnamen}</h3>
                            ${btnHapus}
                        </div>
                        <span class="tanggal-arsip">📅 ${tanggalStr} • 🕒 ${jamStr}</span>
                        <p>👥 Peserta: ${data.jumlah_peserta} Orang</p>
                        <p>🥇 Pemenang: <b>${juara1}</b></p>
                        <button class="btn-detail" onclick="bukaModal('${doc.id}')">👁️ Lihat Hasil</button>
                    </div>`;
                });
            }).catch((error) => {
                console.error("Error loading arsip:", error);
                document.getElementById("wadahArsip").innerHTML = "<p>Gagal memuat data.</p>";
            });
        }

        // --- 3. LOGIKA MODAL ---
        function bukaModal(docId) {
            // Cari data di array global berdasarkan ID
            let data = globalArsipData.find(item => item.id === docId);
            if (!data) return;

            let modal = document.getElementById("modalDetail");
            let tabel = document.getElementById("tabelDetail");
            
            // Format Tanggal Lagi untuk Modal
            let tgl = "-";
            if (data.tanggal && data.tanggal.toDate) {
                tgl = data.tanggal.toDate().toLocaleDateString('id-ID');
            }

            document.getElementById("judulModal").innerText = data.nama_turnamen || "Detail Turnamen";
            document.getElementById("infoModal").innerText = `Diselenggarakan pada ${tgl} | ${data.jumlah_peserta} Peserta`;

            tabel.innerHTML = "";
            
            if(data.detail_klasemen) {
                data.detail_klasemen.forEach((pemain, i) => {
                    let medali = "";
                    let kelas = "";
                    if (i === 0) { medali = "🥇"; kelas="style='background:#fff9c4; font-weight:bold;'"; }
                    else if (i === 1) medali = "🥈";
                    else if (i === 2) medali = "🥉";

                    tabel.innerHTML += `
                    <tr ${kelas}>
                        <td>${i + 1} ${medali}</td>
                        <td>${pemain.nama}</td>
                        <td>${pemain.poin}</td>
                    </tr>`;
                });
            }
            modal.style.display = "flex";
        }

        function tutupModal() { document.getElementById("modalDetail").style.display = "none"; }
        window.onclick = function(event) { if (event.target == document.getElementById("modalDetail")) tutupModal(); }

        // --- 4. LOGIKA HAPUS (DELETE) ---
        function hapusSatuArsip(docId) {
            if (ROLE !== 'admin') return alert("Akses Ditolak");

            if(confirm(`Yakin hapus arsip turnamen ini permanen?`)) {
                arsipRef.doc(docId).delete().then(() => {
                    alert("Arsip berhasil dihapus.");
                    loadArsip(); // Reload data
                }).catch((error) => {
                    alert("Gagal menghapus: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
