<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE PAIRING - UINSA Chess CLub</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1e272e; /* Gelap biar enak di mata/proyektor */
            color: white;
            margin: 0; padding: 20px;
            text-align: center;
        }

        /* Header Turnamen */
        .header-live h1 {
            color: #f1c40f; text-transform: uppercase;
            font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 2px;
        }
        .header-live p { color: #bdc3c7; font-size: 1.2rem; margin-top: 0; }

        /* Container Jadwal */
        .live-container {
            max-width: 900px; margin: 30px auto;
            background: #2c3e50; padding: 30px; border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 2px solid #34495e;
            min-height: 200px;
        }

        /* Style Kartu Match (Grid Layout) */
        .live-card {
            background: white; color: #333;
            margin: 15px 0; padding: 15px 20px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* Kiri - Tengah - Kanan */
            align-items: center;
            font-size: 1.2rem;
            border-left: 10px solid #bdc3c7; /* Default Abu */
            transition: all 0.3s ease;
        }

        .p-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-left { text-align: right; }
        .p-right { text-align: left; }
        
        .vs-badge {
            background: #e74c3c; color: white; padding: 5px 15px;
            border-radius: 20px; font-size: 0.9rem; font-weight: 900;
            min-width: 60px; text-align: center;
        }

        .score-done {
            background: #27ae60 !important; /* Hijau kalau selesai */
        }
        
        .card-done {
            border-left-color: #27ae60;
        }

        /* Babak Judul */
        .round-header {
            background: #34495e; color: #ecf0f1;
            padding: 10px; margin-top: 30px; margin-bottom: 10px; border-radius: 5px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 900;
            font-size: 1.1rem;
        }

        /* Tombol Aksi */
        .action-bar {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            display: flex; gap: 10px;
        }
        .btn-float {
            background: #27ae60; color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .btn-back { background: #e74c3c; }

        /* Watermark */
        .watermark { margin-top: 20px; font-size: 0.8rem; color: #555; }
        
        /* Loading */
        .loading { color: #f1c40f; margin-top: 50px; font-size: 1.2rem; animation: kedip 1s infinite; }
        @keyframes kedip { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="captureArea" style="background:#1e272e; padding:20px; min-height: 100vh;">
        <div class="header-live">
            <h1 id="judulLive">MEMUAT...</h1>
            <p>Jadwal Pertandingan & Pairing</p>
        </div>

        <div id="liveJadwal" class="live-container">
            <div class="loading">Menghubungkan ke Server...</div>
        </div>

        <div class="watermark">Generated by Sistem UKM Catur (Cloud Live)</div>
    </div>

    <div class="action-bar">
        <a href="turnamen.html" class="btn-float btn-back">⬅ Kembali</a>
        <button onclick="downloadGambar()" class="btn-float">📸 Download Gambar</button>
    </div>

    <script>
        // 1. Inisialisasi Firestore
        const db = firebase.firestore();
        const liveRef = db.collection('pengaturan').doc('live');

        // 2. Real-time Listener
        // Fungsi ini akan dipanggil otomatis setiap kali admin mengubah skor
        liveRef.onSnapshot((doc) => {
            const container = document.getElementById("liveJadwal");
            const judulEl = document.getElementById("judulLive");

            if (doc.exists && doc.data().aktif === true) {
                const data = doc.data();
                const matches = data.matches || [];

                judulEl.innerText = data.nama_turnamen || "LIVE TURNAMEN";
                
                // Render Jadwal
                if (matches.length === 0) {
                    container.innerHTML = "<p>Pairing belum dibuat.</p>";
                    return;
                }

                let htmlContent = "";
                let currentRound = 0;

                matches.forEach(match => {
                    // Cek Ganti Babak (Header Baru)
                    if (match.ronde > currentRound) {
                        currentRound = match.ronde;
                        htmlContent += `<div class="round-header">Babak ${currentRound}</div>`;
                    }

                    // Tentukan Status (Selesai/Belum)
                    let scoreText = "VS";
                    let badgeClass = "vs-badge";
                    let cardClass = "live-card";

                    if (match.selesai) {
                        scoreText = match.skor; // Contoh: "1 - 0"
                        badgeClass += " score-done";
                        cardClass += " card-done";
                    }

                    // Tambahkan Kartu Match
                    htmlContent += `
                    <div class="${cardClass}">
                        <div class="p-name p-left">${match.putih}</div>
                        <div style="text-align:center;">
                            <span class="${badgeClass}">${scoreText}</span>
                        </div>
                        <div class="p-name p-right">${match.hitam}</div>
                    </div>`;
                });

                container.innerHTML = htmlContent;

            } else {
                // Jika tidak ada turnamen aktif
                judulEl.innerText = "TIDAK ADA TURNAMEN";
                container.innerHTML = "<p style='padding:40px; color:#aaa;'>Saat ini tidak ada pertandingan yang sedang berlangsung.</p>";
            }
        });

        // 3. Fungsi Download Gambar
        function downloadGambar() {
            window.scrollTo(0,0);
            const area = document.getElementById("captureArea");
            
            // Ubah sedikit style agar screenshot pas
            const originalHeight = area.style.minHeight;
            area.style.minHeight = "auto"; 
            
            html2canvas(area, {
                backgroundColor: "#1e272e", // Pastikan background terbawa
                scale: 2 // Kualitas HD
            }).then(canvas => {
                // Kembalikan style
                area.style.minHeight = originalHeight;

                // Download
                let link = document.createElement('a');
                let namaFile = document.getElementById("judulLive").innerText;
                link.download = 'Jadwal-' + namaFile + '.jpg';
                link.href = canvas.toDataURL("image/jpeg");
                link.click();
            });
        }
    </script>
</body>
</html>
