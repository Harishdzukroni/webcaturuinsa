<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE PAIRING - UINSA Chess CLub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1e272e; /* Gelap biar enak di mata/proyektor */
            color: white;
            margin: 0; padding: 20px;
            text-align: center;
        }

        /* Header Turnamen */
        .header-live h1 {
            color: #f1c40f; text-transform: uppercase;
            font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 2px;
        }
        .header-live p { color: #bdc3c7; font-size: 1.2rem; }

        /* Container Jadwal */
        .live-container {
            max-width: 900px; margin: 30px auto;
            background: #2c3e50; padding: 30px; border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 2px solid #34495e;
        }

        /* Modifikasi Tampilan Jadwal yg diambil dari LocalStorage */
        .match-card {
            background: white; color: #333;
            margin: 15px 0; padding: 20px;
            border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem;
            border-left: 10px solid #f1c40f; /* Aksen Kuning */
        }
        
        /* Babak Judul */
        div[style*="background:#ecf0f1"] {
            background: #34495e !important; color: #ecf0f1;
            padding: 10px; margin-top: 30px; border-radius: 5px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 900;
        }

        /* Sembunyikan Dropdown Select (Admin) ganti dengan Status */
        select { display: none; }
        .status-badge {
            background: #333; color: white; padding: 5px 15px;
            border-radius: 20px; font-size: 0.8rem; font-weight: bold;
        }

        /* Tombol Aksi (Tidak ikut ter-screenshot) */
        .action-bar {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            display: flex; gap: 10px;
        }
        .btn-float {
            background: #27ae60; color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .btn-back { background: #e74c3c; }

        /* Watermark */
        .watermark {
            margin-top: 20px; font-size: 0.8rem; color: #555;
        }
    </style>
</head>
<body>

    <div id="captureArea" style="background:#1e272e; padding:20px;">
        <div class="header-live">
            <h1 id="judulLive">NAMA TURNAMEN</h1>
            <p>Jadwal Pertandingan & Pairing</p>
        </div>

        <div id="liveJadwal" class="live-container">
            <p style="color:#777;">Menunggu jadwal dari Admin...</p>
        </div>

        <div class="watermark">Generated by Sistem UKM Catur</div>
    </div>

    <div class="action-bar">
        <a href="turnamen.html" class="btn-float btn-back">⬅ Kembali</a>
        <button onclick="downloadGambar()" class="btn-float">📸 Download Gambar (Share WA)</button>
    </div>

    <script>
        // 1. Ambil Data dari LocalStorage
        const judul = localStorage.getItem('ukm_judul_turnamen');
        const htmlJadwal = localStorage.getItem('ukm_sesi_jadwal');
        const skorData = JSON.parse(localStorage.getItem('ukm_sesi_skor')) || [];

        // 2. Tampilkan Judul
        if(judul) document.getElementById("judulLive").innerText = judul;

        // 3. Tampilkan Jadwal & Bersihkan Tampilan Admin
        if(htmlJadwal) {
            let container = document.getElementById("liveJadwal");
            container.innerHTML = htmlJadwal;

            // --- TEKNIK PEMBERSIHAN (DOM MANIPULATION) ---
            // Kita ubah elemen <select> admin menjadi teks biasa untuk penonton
            let selects = container.querySelectorAll('select');
            
            selects.forEach((sel, index) => {
                // Ambil nilai skor yang tersimpan
                let nilai = skorData[index] || "belum";
                
                // Buat elemen baru (Badge Status)
                let badge = document.createElement("span");
                badge.className = "status-badge";

                if(nilai === "belum") {
                    badge.innerText = "VS"; // Belum main
                    badge.style.background = "#e74c3c"; // Merah
                } else {
                    badge.innerText = nilai; // Hasil Skor (1-0, dll)
                    badge.style.background = "#27ae60"; // Hijau
                }

                // Ganti select dengan badge
                sel.parentNode.replaceChild(badge, sel);
            });
        }

        // 4. Fungsi Download Gambar
        function downloadGambar() {
            window.scrollTo(0,0); // Scroll ke atas dulu
            
            html2canvas(document.getElementById("captureArea")).then(canvas => {
                // Buat link download palsu
                let link = document.createElement('a');
                link.download = 'Jadwal-' + (judul || 'Turnamen') + '.jpg';
                link.href = canvas.toDataURL("image/jpeg");
                link.click();
            });
        }
    </script>
</body>
</html>
