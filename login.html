<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UINSA Chess Club</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 30px; }
        
        input {
            width: 90%; padding: 12px; margin-bottom: 15px;
            border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: #34495e; }

        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .btn-admin { background: #2c3e50; color: white; margin-bottom: 10px; }
        .btn-admin:hover { background: #1a252f; }
        
        .btn-guest { background: #ecf0f1; color: #2c3e50; }
        .btn-guest:hover { background: #bdc3c7; }

        .error { color: #e74c3c; font-size: 0.85rem; display: none; margin-bottom: 15px; background: #fadbd8; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" style="width: 100px; margin-bottom: 20px;" alt="Logo UKM">
        <h2>UINSA Chess Club</h2>
        <p>Masuk ke Dashboard</p>

        <div id="errorMsg" class="error"></div>

        <div id="formAdmin">
            <input type="email" id="inputEmail" placeholder="Email Admin (di Firebase)...">
            <input type="password" id="inputPass" placeholder="Password...">
            
            <button class="btn-admin" id="btnLogin" onclick="loginAdmin()">Masuk sebagai Admin</button>
        </div>

        <div style="margin: 15px 0; font-size: 0.8rem; color: #aaa;">ATAU</div>
        
        <button class="btn-guest" onclick="loginTamu()">Masuk sebagai Penonton</button>
    </div>

    <script>
        // 1. Inisialisasi Auth
        const auth = firebase.auth();

        // 2. Cek Status Login (Auto Redirect)
        // Jika user sebelumnya sudah login dan belum logout, langsung masuk.
        auth.onAuthStateChanged((user) => {
            if (user) {
                localStorage.setItem('ukm_role', 'admin');
                window.location.href = 'index.html';
            }
        });

        // 3. Fungsi Login Admin (Firebase)
        function loginAdmin() {
            const email = document.getElementById("inputEmail").value;
            const pass = document.getElementById("inputPass").value;
            const btn = document.getElementById("btnLogin");
            const errorBox = document.getElementById("errorMsg");

            // Validasi sederhana
            if(!email || !pass) {
                errorBox.innerText = "Email dan Password wajib diisi!";
                errorBox.style.display = "block";
                return;
            }

            // Ubah tombol jadi loading
            btn.innerText = "Memproses...";
            btn.disabled = true;
            errorBox.style.display = "none";

            // Proses Login ke Firebase
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Berhasil
                    console.log("Login sukses:", userCredential.user);
                    localStorage.setItem('ukm_role', 'admin');
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    // Gagal
                    console.error(error);
                    btn.innerText = "Masuk sebagai Admin";
                    btn.disabled = false;
                    
                    let pesan = "Login Gagal.";
                    if(error.code === 'auth/user-not-found') pesan = "Email tidak terdaftar.";
                    if(error.code === 'auth/wrong-password') pesan = "Password salah.";
                    if(error.code === 'auth/invalid-email') pesan = "Format email salah.";
                    
                    errorBox.innerText = pesan;
                    errorBox.style.display = "block";
                });
        }

        // 4. Fungsi Login Tamu (Lokal Saja)
        function loginTamu() {
            // Tamu tidak perlu masuk ke Firebase Auth, cukup simpan role di localStorage
            localStorage.setItem('ukm_role', 'guest');
            
            // Opsional: Jika ingin database aman, bisa gunakan auth.signInAnonymously()
            // Tapi untuk kesederhanaan, kita redirect langsung.
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
