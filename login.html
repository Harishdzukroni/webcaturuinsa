<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UINSA Chess Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .logo { font-size: 3rem; margin-bottom: 10px; display: block; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 30px; }
        
        input {
            width: 90%; padding: 12px; margin-bottom: 15px;
            border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .btn-admin { background: #2c3e50; color: white; margin-bottom: 10px; }
        .btn-admin:hover { background: #1a252f; }
        
        .btn-guest { background: #ecf0f1; color: #2c3e50; }
        .btn-guest:hover { background: #bdc3c7; }

        .error { color: red; font-size: 0.85rem; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" style="width: 100px; margin-bottom: 20px;">
        <h2>UINSA Chess Club</h2>
        <p>Silakan masuk untuk melanjutkan</p>

        <p id="errorMsg" class="error">Password Salah!</p>

        <input type="password" id="inputPass" placeholder="Password Admin...">
        
        <button class="btn-admin" onclick="loginAdmin()">Masuk sebagai Admin</button>
        <div style="margin: 10px 0; font-size: 0.8rem; color: #aaa;">ATAU</div>
        <button class="btn-guest" onclick="loginTamu()">Masuk sebagai Penonton</button>
    </div>

    <script>
        // Cek jika sudah login, langsung lempar ke index
        if(localStorage.getItem('ukm_role')) {
            window.location.href = 'index.html';
        }

        function loginAdmin() {
            let pass = document.getElementById("inputPass").value;
            // --- GANTI PASSWORD DISINI ---
            if(pass === "admin123") {
                localStorage.setItem('ukm_role', 'admin');
                window.location.href = 'index.html';
            } else {
                document.getElementById("errorMsg").style.display = 'block';
            }
        }

        function loginTamu() {
            localStorage.setItem('ukm_role', 'guest');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
